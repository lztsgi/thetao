name: singbox

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: rules-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup sing-box
        env:
          SING_BOX_DEB_URL: "https://github.com/SagerNet/sing-box/releases/download/v1.13.6/sing-box_1.13.6_linux_amd64.deb"
        run: |
          set -Eeuo pipefail
          wget -O sing-box.deb "$SING_BOX_DEB_URL"
          sudo dpkg -i sing-box.deb

      - name: Set up Python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install pandas requests pyyaml

      - name: Run Python script
        working-directory: ./singbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import pandas as pd
          import re
          import concurrent.futures
          import os
          import json
          import shutil
          import subprocess
          import requests
          import yaml
          import ipaddress
          from datetime import datetime, timezone
          from io import StringIO
          from urllib.parse import urldefrag

          # =========================================================
          # 1) 基础映射配置
          # =========================================================
          MAP_DICT = {
              'DOMAIN-SUFFIX': 'domain_suffix',
              'HOST-SUFFIX': 'domain_suffix',
              'host-suffix': 'domain_suffix',
              'DOMAIN': 'domain',
              'HOST': 'domain',
              'host': 'domain',
              'DOMAIN-KEYWORD': 'domain_keyword',
              'HOST-KEYWORD': 'domain_keyword',
              'host-keyword': 'domain_keyword',
              'IP-CIDR': 'ip_cidr',
              'ip-cidr': 'ip_cidr',
              'IP-CIDR6': 'ip_cidr',
              'IP6-CIDR': 'ip_cidr',
              'SRC-IP-CIDR': 'source_ip_cidr',
              'GEOIP': 'geoip',
              'DST-PORT': 'port',
              'SRC-PORT': 'source_port',
              'URL-REGEX': 'domain_regex',
              'DOMAIN-REGEX': 'domain_regex'
          }

          IP_ONLY_KEYS = {'ip_cidr', 'source_ip_cidr', 'geoip'}

          # =========================================================
          # 2) 读取远程规则文件
          # =========================================================
          def read_yaml_from_url(url):
              headers = {'User-Agent': 'Mozilla/5.0'}
              response = requests.get(url, headers=headers, timeout=60)
              response.raise_for_status()
              yaml_data = yaml.safe_load(response.text)
              return yaml_data

          def read_list_from_url(url):
              headers = {'User-Agent': 'Mozilla/5.0'}
              response = requests.get(url, headers=headers, timeout=60)
              if response.status_code == 200:
                  csv_data = StringIO(response.text)
                  df = pd.read_csv(
                      csv_data,
                      header=None,
                      names=['pattern', 'address', 'other', 'other2', 'other3'],
                      on_bad_lines='skip'
                  )
              else:
                  return None

              filtered_rows = []
              rules = []

              if 'AND' in df['pattern'].values:
                  and_rows = df[df['pattern'].str.contains('AND', na=False)]
                  for _, row in and_rows.iterrows():
                      rule = {
                          "type": "logical",
                          "mode": "and",
                          "rules": []
                      }
                      pattern = ",".join(row.values.astype(str))
                      components = re.findall(r'\((.*?)\)', pattern)
                      for component in components:
                          for keyword in MAP_DICT.keys():
                              if keyword in component:
                                  match = re.search(f'{keyword},(.*)', component)
                                  if match:
                                      value = match.group(1)
                                      rule["rules"].append({
                                          MAP_DICT[keyword]: value
                                      })
                      rules.append(rule)

              for _, row in df.iterrows():
                  if 'AND' not in str(row['pattern']):
                      filtered_rows.append(row)

              df_filtered = pd.DataFrame(
                  filtered_rows,
                  columns=['pattern', 'address', 'other', 'other2', 'other3']
              )
              return df_filtered, rules

          # =========================================================
          # 3) 规则类型识别与解析
          # =========================================================
          def is_ipv4_or_ipv6(address):
              try:
                  ipaddress.IPv4Network(address)
                  return 'ipv4'
              except ValueError:
                  try:
                      ipaddress.IPv6Network(address)
                      return 'ipv6'
                  except ValueError:
                      return None

          def parse_and_convert_to_dataframe(link):
              rules = []
              if link.endswith('.yaml') or link.endswith('.txt'):
                  try:
                      yaml_data = read_yaml_from_url(link)
                      rows = []
                      if not isinstance(yaml_data, str):
                          items = yaml_data.get('payload', [])
                      else:
                          lines = yaml_data.splitlines()
                          line_content = lines[0] if lines else ""
                          items = line_content.split()

                      for item in items:
                          address = item.strip("'")
                          if ',' not in item:
                              if is_ipv4_or_ipv6(item):
                                  pattern = 'IP-CIDR'
                              else:
                                  if address.startswith('+') or address.startswith('.'):
                                      pattern = 'DOMAIN-SUFFIX'
                                      address = address[1:]
                                      if address.startswith('.'):
                                          address = address[1:]
                                  else:
                                      pattern = 'DOMAIN'
                          else:
                              pattern, address = item.split(',', 1)
                              if ',' in address:
                                  address = address.split(',', 1)[0]

                          rows.append({
                              'pattern': pattern.strip(),
                              'address': address.strip(),
                              'other': None
                          })

                      df = pd.DataFrame(rows, columns=['pattern', 'address', 'other'])
                  except Exception:
                      df, rules = read_list_from_url(link)
              else:
                  df, rules = read_list_from_url(link)

              return df, rules

          def sort_dict(obj):
              if isinstance(obj, dict):
                  return {k: sort_dict(obj[k]) for k in sorted(obj)}
              elif isinstance(obj, list) and all(isinstance(elem, dict) for elem in obj):
                  return sorted([sort_dict(x) for x in obj], key=lambda d: sorted(d.keys())[0])
              elif isinstance(obj, list):
                  return sorted(sort_dict(x) for x in obj)
              else:
                  return obj

          def choose_output_directory(result_rules, geo_output_directory, geosite_output_directory):
              rule_keys = set()
              for rule in result_rules.get("rules", []):
                  rule_keys.update(rule.keys())

              if rule_keys and rule_keys.issubset(IP_ONLY_KEYS):
                  return geo_output_directory
              return geosite_output_directory

          # =========================================================
          # 4) sing-box 编译
          # =========================================================
          def compile_json_to_srs(json_path, srs_path=None):
              if srs_path is None:
                  srs_path = os.path.splitext(json_path)[0] + ".srs"

              result = subprocess.run(
                  [
                      "sing-box",
                      "rule-set",
                      "compile",
                      "--output",
                      srs_path,
                      json_path
                  ],
                  check=False
              )
              return result.returncode == 0, srs_path

          def decompile_srs_to_json(srs_path, json_path):
              result = subprocess.run(
                  [
                      "sing-box",
                      "rule-set",
                      "decompile",
                      "--output",
                      json_path,
                      srs_path
                  ],
                  check=False
              )
              return result.returncode == 0

          # =========================================================
          # 5) singbox.txt 来源清单与特殊链接解析
          #
          # 普通转换源：URL 或 URL@名称
          # 远程规则集：RULE-SET|仓库|标签|JSON_URL|SRS_URL
          # 全局选项：OPTION|max_repository_inactive_days|90
          # =========================================================
          def parse_source_list(lines):
              normal_links = []
              configured_rule_sets = []
              max_repository_inactive_days = 90
              seen_options = set()

              for line_number, raw_line in enumerate(lines, start=1):
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue

                  if line.startswith("OPTION|"):
                      parts = line.split("|", 2)
                      if len(parts) != 3:
                          raise ValueError(f"singbox.txt 第 {line_number} 行 OPTION 格式错误")

                      _, option_name, option_value = parts
                      option_name = option_name.strip()
                      option_value = option_value.strip()

                      if option_name in seen_options:
                          raise ValueError(f"singbox.txt 中存在重复选项: {option_name}")
                      seen_options.add(option_name)

                      if option_name == "max_repository_inactive_days":
                          max_repository_inactive_days = int(option_value)
                      else:
                          raise ValueError(f"singbox.txt 中存在未知选项: {option_name}")
                      continue

                  if line.startswith("RULE-SET|"):
                      parts = line.split("|", 4)
                      if len(parts) != 5:
                          raise ValueError(f"singbox.txt 第 {line_number} 行 RULE-SET 格式错误")

                      _, repository, tag, json_url, srs_url = parts
                      configured_rule_sets.append({
                          "repository": repository.strip(),
                          "tag": tag.strip(),
                          "json_url": json_url.strip(),
                          "srs_url": srs_url.strip()
                      })
                      continue

                  normal_links.append(line)

              return normal_links, configured_rule_sets, max_repository_inactive_days

          # =========================================================
          # 6) 特殊链接解析
          #    支持：
          #    #release-assets@other-rule
          #    #release-assets@rule-set/other
          #    #release-assets@/rule-set/other
          # =========================================================
          def parse_special_link(raw_link):
              clean_link, fragment = urldefrag(raw_link.strip())
              mode = None
              output_subdir = None

              if fragment:
                  parts = fragment.split('@', 1)
                  mode = parts[0].strip() if parts[0].strip() else None
                  if len(parts) > 1:
                      output_subdir = parts[1].strip() if parts[1].strip() else None

              return clean_link, mode, output_subdir

          def normalize_repo_relative_dir(path_value, default_dir="./rule-set/other-rule"):
              if not path_value:
                  return os.path.normpath(default_dir)

              p = path_value.strip().replace("\\", "/")

              while p.startswith("/"):
                  p = p[1:]

              while p.startswith("./"):
                  p = p[2:]

              if not p:
                  return os.path.normpath(default_dir)

              if not p.startswith("rule-set/"):
                  p = f"rule-set/{p}"

              return os.path.normpath(f"./{p}")

          # =========================================================
          # 7) 下载 GitHub Release Assets
          # =========================================================
          def download_github_release_assets(tag_url, output_directory):
              headers = {
                  'User-Agent': 'Mozilla/5.0',
                  'Accept': 'application/vnd.github+json'
              }

              clean_url, _ = urldefrag(tag_url)
              m = re.match(r'https://github\.com/([^/]+)/([^/]+)/releases/tag/([^/#]+)', clean_url)
              if not m:
                  raise ValueError(f"不是有效的 GitHub release tag 链接: {tag_url}")

              owner, repo, tag = m.groups()
              api_url = f"https://api.github.com/repos/{owner}/{repo}/releases/tags/{tag}"

              response = requests.get(api_url, headers=headers, timeout=60)
              response.raise_for_status()
              release_data = response.json()

              os.makedirs(output_directory, exist_ok=True)

              for asset in release_data.get("assets", []):
                  asset_name = (asset.get("name") or "").strip()
                  download_url = asset.get("browser_download_url")

                  if not asset_name or not download_url:
                      continue

                  if asset_name.startswith("Source code") or asset_name in {"Source code (zip)", "Source code (tar.gz)"}:
                      continue

                  save_path = os.path.join(output_directory, asset_name)

                  asset_resp = requests.get(download_url, headers=headers, stream=True, timeout=120)
                  asset_resp.raise_for_status()

                  with open(save_path, "wb") as f:
                      for chunk in asset_resp.iter_content(chunk_size=8192):
                          if chunk:
                              f.write(chunk)

                  print(f"已下载 release asset: {os.path.relpath(save_path, '.')}")

          # =========================================================
          # 8) 下载配置中使用的远程 JSON/SRS 规则集
          # =========================================================
          def download_to_temporary_file(url, destination):
              headers = {'User-Agent': 'Mozilla/5.0'}
              temporary_path = f"{destination}.download"

              try:
                  response = requests.get(url, headers=headers, stream=True, timeout=120)
                  response.raise_for_status()

                  with open(temporary_path, "wb") as output_file:
                      for chunk in response.iter_content(chunk_size=8192):
                          if chunk:
                              output_file.write(chunk)

                  return temporary_path
              except Exception:
                  if os.path.exists(temporary_path):
                      os.remove(temporary_path)
                  raise

          def validate_rule_set_json(json_path):
              with open(json_path, 'r', encoding='utf-8') as input_file:
                  rule_set = json.load(input_file)

              if not isinstance(rule_set, dict):
                  raise ValueError("规则集 JSON 顶层必须是对象")
              if not isinstance(rule_set.get("version"), int):
                  raise ValueError("规则集 JSON 缺少整数 version")
              if not isinstance(rule_set.get("rules"), list):
                  raise ValueError("规则集 JSON 缺少 rules 数组")

          def validate_source_repository_activity(entries, max_inactive_days):
              if not isinstance(max_inactive_days, int) or max_inactive_days < 1:
                  raise ValueError("max_repository_inactive_days 必须是正整数")

              repositories = sorted({
                  (entry.get("repository") or "").strip()
                  for entry in entries
              })
              headers = {
                  'User-Agent': 'rules-singbox-workflow',
                  'Accept': 'application/vnd.github+json'
              }
              github_token = os.environ.get("GITHUB_TOKEN")
              if github_token:
                  headers['Authorization'] = f"Bearer {github_token}"

              current_time = datetime.now(timezone.utc)
              for repository in repositories:
                  if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
                      raise ValueError(f"无效的上游仓库: {repository!r}")

                  response = requests.get(
                      f"https://api.github.com/repos/{repository}",
                      headers=headers,
                      timeout=60
                  )
                  response.raise_for_status()
                  repository_data = response.json()

                  if repository_data.get("archived"):
                      raise RuntimeError(f"上游仓库已归档: {repository}")
                  if repository_data.get("disabled"):
                      raise RuntimeError(f"上游仓库已禁用: {repository}")

                  pushed_at = repository_data.get("pushed_at")
                  if not pushed_at:
                      raise RuntimeError(f"无法获取上游仓库维护时间: {repository}")

                  pushed_time = datetime.fromisoformat(pushed_at.replace("Z", "+00:00"))
                  inactive_days = (current_time - pushed_time).days
                  if inactive_days > max_inactive_days:
                      raise RuntimeError(
                          f"上游仓库已超过 {max_inactive_days} 天未更新: "
                          f"{repository} (pushed_at={pushed_at})"
                      )

                  print(
                      f"上游仓库活跃: {repository}, "
                      f"pushed_at={pushed_at}, inactive_days={inactive_days}"
                  )

          def download_configured_rule_sets(entries, max_inactive_days, output_directory):
              if not entries:
                  raise ValueError("singbox.txt 中没有配置远程 JSON/SRS 规则集")

              validate_source_repository_activity(entries, max_inactive_days)

              staging_directory = f"{output_directory}.staging"
              if os.path.exists(staging_directory):
                  shutil.rmtree(staging_directory)
              os.makedirs(staging_directory, exist_ok=True)

              seen_tags = set()

              try:
                  for entry in entries:
                      tag = (entry.get("tag") or "").strip()
                      repository = (entry.get("repository") or "").strip()
                      json_url = (entry.get("json_url") or "").strip()
                      srs_url = (entry.get("srs_url") or "").strip()

                      if not re.fullmatch(r'[A-Za-z0-9._-]+', tag):
                          raise ValueError(f"无效的规则标签: {tag!r}")
                      if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
                          raise ValueError(f"规则 {tag} 的 repository 无效: {repository!r}")
                      if tag in seen_tags:
                          raise ValueError(f"重复的规则标签: {tag}")
                      if not json_url and not srs_url:
                          raise ValueError(f"规则 {tag} 未配置 json_url 或 srs_url")
                      repository_prefix = f"https://raw.githubusercontent.com/{repository}/"
                      for source_url in [json_url, srs_url]:
                          if source_url and not source_url.startswith(repository_prefix):
                              raise ValueError(f"规则 {tag} 的源站与 repository 不一致: {source_url}")
                      seen_tags.add(tag)

                      json_path = os.path.join(staging_directory, f"{tag}.json")
                      srs_path = os.path.join(staging_directory, f"{tag}.srs")
                      json_temporary_path = None
                      srs_temporary_path = None

                      try:
                          if json_url:
                              json_temporary_path = download_to_temporary_file(json_url, json_path)
                              validate_rule_set_json(json_temporary_path)

                          if srs_url:
                              srs_temporary_path = download_to_temporary_file(srs_url, srs_path)

                          if json_temporary_path is None:
                              json_temporary_path = f"{json_path}.download"
                              if not decompile_srs_to_json(srs_temporary_path, json_temporary_path):
                                  raise RuntimeError(f"SRS 反编译失败: {tag}")
                              validate_rule_set_json(json_temporary_path)

                          if srs_temporary_path is None:
                              srs_temporary_path = f"{srs_path}.download"
                              ok, _ = compile_json_to_srs(json_temporary_path, srs_temporary_path)
                              if not ok:
                                  raise RuntimeError(f"JSON 编译失败: {tag}")

                          os.replace(json_temporary_path, json_path)
                          os.replace(srs_temporary_path, srs_path)
                          print(f"已更新远程规则集: {tag} <- {repository}")
                      finally:
                          for temporary_path in [json_temporary_path, srs_temporary_path]:
                              if temporary_path and os.path.exists(temporary_path):
                                  os.remove(temporary_path)

                  if os.path.exists(output_directory):
                      shutil.rmtree(output_directory)
                  os.replace(staging_directory, output_directory)
              finally:
                  if os.path.exists(staging_directory):
                      shutil.rmtree(staging_directory)

          # =========================================================
          # 9) 原有规则转换逻辑
          # =========================================================
          def parse_list_file(link, geo_output_directory, geosite_output_directory):
              try:
                  if '@' in link:
                      parts = link.rsplit('@', 1)
                      url = parts[0]
                      custom_name = parts[1] if len(parts) > 1 and '/' not in parts[1] else None
                      if custom_name:
                          base_filename = custom_name
                      else:
                          base_filename = os.path.basename(url).split('.')[0]
                  else:
                      url = link
                      base_filename = os.path.basename(url).split('.')[0]

                  with concurrent.futures.ThreadPoolExecutor() as executor:
                      results = list(executor.map(parse_and_convert_to_dataframe, [url]))
                      dfs = [df for df, rules in results if df is not None]
                      rules_list = [rules for df, rules in results if df is not None]

                      if not dfs:
                          raise ValueError(f"未能解析规则内容: {url}")

                      df = pd.concat(dfs, ignore_index=True)
                      df = df[~df['pattern'].astype(str).str.contains('#', na=False)].reset_index(drop=True)
                      df = df[df['pattern'].isin(MAP_DICT.keys())].reset_index(drop=True)
                      df = df.drop_duplicates().reset_index(drop=True)
                      df['pattern'] = df['pattern'].replace(MAP_DICT)

                      result_rules = {"version": 3, "rules": []}
                      domain_entries = []

                      for pattern, addresses in df.groupby('pattern')['address'].apply(list).to_dict().items():
                          if pattern == 'domain_suffix':
                              rule_entry = {pattern: [address.strip() for address in addresses]}
                              result_rules["rules"].append(rule_entry)
                          elif pattern == 'domain':
                              domain_entries.extend([address.strip() for address in addresses])
                          else:
                              rule_entry = {pattern: [address.strip() for address in addresses]}
                              result_rules["rules"].append(rule_entry)

                      for extra_rules in rules_list:
                          if extra_rules:
                              result_rules["rules"].extend(extra_rules)

                      domain_entries = list(set(domain_entries))
                      if domain_entries:
                          result_rules["rules"].insert(0, {'domain': domain_entries})

                      output_directory = choose_output_directory(
                          result_rules,
                          geo_output_directory,
                          geosite_output_directory
                      )

                      os.makedirs(output_directory, exist_ok=True)

                      file_name = os.path.join(output_directory, f"{base_filename}.json")
                      with open(file_name, 'w', encoding='utf-8') as output_file:
                          result_rules_str = json.dumps(sort_dict(result_rules), ensure_ascii=False, indent=2)
                          result_rules_str = result_rules_str.replace('\\\\', '\\')
                          output_file.write(result_rules_str)

                      ok, srs_path = compile_json_to_srs(file_name)
                      if not ok:
                          print(f"编译失败: {file_name}")

                      return os.path.relpath(file_name, ".")

              except Exception as e:
                  print(f'获取链接出错,已跳过:{link},原因:{str(e)}')
                  return None

          # =========================================================
          # 10) 编译本地手动 json
          # =========================================================
          def compile_manual_local_jsons(geo_output_dir, geosite_output_dir):
              local_jsons = []

              for base_dir in [geo_output_dir, geosite_output_dir]:
                  if not os.path.exists(base_dir):
                      continue
                  for entry in os.listdir(base_dir):
                      if entry.endswith(".json"):
                          rel_path = os.path.relpath(os.path.join(base_dir, entry), ".")
                          local_jsons.append(rel_path)

              manual_jsons = sorted(set(local_jsons))

              for rel_json in manual_jsons:
                  abs_json = os.path.join(".", rel_json)
                  ok, srs_path = compile_json_to_srs(abs_json)
                  if ok:
                      print(f"本地手动 json 已编译: {rel_json}")
                  else:
                      print(f"本地手动 json 编译失败: {rel_json}")

          # =========================================================
          # 11) 主流程
          # =========================================================
          with open("singbox.txt", 'r', encoding='utf-8') as links_file:
              source_lines = links_file.read().splitlines()

          links, configured_rule_sets, max_repository_inactive_days = parse_source_list(source_lines)

          geo_output_dir = "./rule-set/geo"
          geosite_output_dir = "./rule-set/geosite"
          default_other_rule_output_dir = "./rule-set/other-rule"
          configured_other_output_dir = "./rule-set/other"

          os.makedirs(geo_output_dir, exist_ok=True)
          os.makedirs(geosite_output_dir, exist_ok=True)
          os.makedirs(default_other_rule_output_dir, exist_ok=True)
          os.makedirs(configured_other_output_dir, exist_ok=True)

          for raw_link in links:
              link, mode, output_subdir = parse_special_link(raw_link)

              if mode == "release-assets":
                  try:
                      target_dir = normalize_repo_relative_dir(
                          output_subdir,
                          default_dir=default_other_rule_output_dir
                      )
                      os.makedirs(target_dir, exist_ok=True)

                      download_github_release_assets(
                          link,
                          target_dir
                      )
                  except Exception as e:
                      print(f'下载 release assets 出错,已跳过:{raw_link},原因:{str(e)}')
                  continue

              parse_list_file(
                  raw_link,
                  geo_output_directory=geo_output_dir,
                  geosite_output_directory=geosite_output_dir
              )

          download_configured_rule_sets(
              configured_rule_sets,
              max_repository_inactive_days,
              configured_other_output_dir
          )

          compile_manual_local_jsons(geo_output_dir, geosite_output_dir)
          EOF

      - name: Commit and push config
        run: |
          set -Eeuo pipefail
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          git add -A ./singbox/rule-set

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update sing-box rules"
          git pull --rebase origin main
          git push origin HEAD:main
